<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختر وجهتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: blueprint sheet. Building picker and search on top, map as the hero, walking steps below. Phone first. */
:root{
  --paper:#eef3fa; --surface:#ffffff; --ink:#12233d; --muted:#586a84;
  --line:#2a5ca6; --room:#e3ecf8; --route:#e2560a; --route-soft:#ffe1cc; --alert:#c62828;
  --display:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c1524; --surface:#142136; --ink:#e7eef9; --muted:#9db0cb;
    --line:#82b2f2; --room:#1b2d4a; --route:#ff9548; --route-soft:#5a3115; --alert:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1524; --surface:#142136; --ink:#e7eef9; --muted:#9db0cb;
  --line:#82b2f2; --room:#1b2d4a; --route:#ff9548; --route-soft:#5a3115; --alert:#ff8a80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:10px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.2;margin:0;text-wrap:balance}
.college{color:var(--muted);font-size:14px;margin:0}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--surface);font-weight:600}
.startbox{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
#start{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper[hidden]{display:none}
.stepper button{font:inherit;font-weight:600;color:var(--surface);background:var(--line);border:0;border-radius:8px;padding:10px 18px;min-width:96px;cursor:pointer}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper span{font-size:14px;color:var(--muted)}
#guide li.cur{font-weight:600;color:var(--route)}
#here{transition:transform .45s ease}
h2{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 8px}
.chooser{display:flex;flex-direction:column;gap:10px}
.secs{display:flex;gap:6px;flex-wrap:wrap}
.secs button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.secs button[aria-pressed="true"]{background:var(--line);color:var(--surface);font-weight:600}
#q{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
#q::placeholder{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:236px;overflow-y:auto;padding:2px}
.dest{font:inherit;font-weight:500;text-align:right;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:48px;justify-content:center;line-height:1.4}
.dest small{font-weight:400;font-size:12px;color:var(--muted)}
.dest[aria-pressed="true"]{background:var(--route);border-color:var(--route);color:#fff}
.dest[aria-pressed="true"] small{color:#fff}
.none{color:var(--muted);margin:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--route);outline-offset:2px}
#legs{align-self:flex-start}
#legs[hidden]{display:none}
.mapbox{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
#map{display:block;width:100%;aspect-ratio:4/3;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
@media (min-width:640px){#map{aspect-ratio:16/10}}
.zoom{position:absolute;bottom:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px var(--body);cursor:pointer}
.zoom button.fit{font-size:11px}
.floor{position:absolute;top:10px;inset-inline-end:10px;background:var(--line);color:var(--surface);font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
#guide{background:var(--surface);border:1.5px solid var(--line);border-inline-start:6px solid var(--route);border-radius:8px;padding:14px 16px}
#guide h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0;line-height:1.3}
#guide .where{color:var(--muted);font-size:14px;margin:0 0 8px}
#guide h4{font-size:14px;font-weight:600;color:var(--line);margin:10px 0 2px}
#guide ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:4px}
#guide p{margin:0;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center}
/* map drawing */
.floorbg{fill:var(--surface)}
.floorbg.wall{stroke:var(--line);stroke-width:2}
.room{fill:var(--room);stroke:var(--line);stroke-width:2}
.zone{fill:var(--room);fill-opacity:.45;stroke:var(--line);stroke-width:1.5;stroke-dasharray:7 6}
.pick{cursor:pointer}
.room.on,.zone.on{fill:var(--route-soft);fill-opacity:1;stroke:var(--route);stroke-width:3}
.stair{fill:none;stroke:var(--line);stroke-width:1}
.gap{stroke:var(--surface);stroke-width:5}
.lbl{fill:var(--ink);font-family:var(--body);font-size:14px;text-anchor:middle;pointer-events:none}
.lbl.s{font-size:10px}
.lbl.ent{fill:var(--line);font-weight:600;font-size:15px}
.lbl.note{fill:var(--muted);font-size:11px}
.lbl.exit{fill:var(--alert);font-size:11px;font-weight:600}
#path{fill:none;stroke:var(--route);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 12;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
#here circle.p{fill:var(--route);opacity:.3;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.5);opacity:.5}to{transform:scale(1.6);opacity:0}}
#here circle.c{fill:var(--route);stroke:var(--surface);stroke-width:3}
#here text{fill:var(--route);font-weight:600;font-size:14px}
#pin{fill:var(--route);stroke:var(--surface);stroke-width:2}
@media (prefers-reduced-motion:reduce){#path,#here circle.p{animation:none}#here{transition:none}}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>اختر وجهتك</h1>
      <p class="college">الكلية التقنية بالعارضة</p>
    </div>
    <label class="startbox">موقعك الآن<select id="start"></select></label>
  </header>

  <section class="chooser">
    <h2>إلى أين تريد الذهاب؟</h2>
    <input id="q" type="search" placeholder="ابحث باسم المكان، مثل: معمل ٦" aria-label="ابحث عن وجهة">
    <div class="secs" id="secs" role="group" aria-label="المبنى"></div>
    <div class="grid" id="list"></div>
  </section>

  <div class="seg" id="legs" role="group" aria-label="مراحل المسار" hidden></div>

  <div class="mapbox">
    <svg id="map" role="img" aria-label="مخطط المبنى"></svg>
    <span class="floor" id="badge"></span>
    <div class="zoom">
      <button type="button" id="zin" aria-label="تكبير">+</button>
      <button type="button" id="zout" aria-label="تصغير">−</button>
      <button type="button" id="zfit" class="fit" aria-label="عرض الخريطة كاملة">الكل</button>
    </div>
  </div>

  <div class="stepper" id="stepper" hidden>
    <button type="button" id="prev">السابق</button>
    <span id="count"></span>
    <button type="button" id="next">التالي</button>
  </div>

  <section id="guide" aria-live="polite"></section>

  <footer>الإصدار ٠٫٣ · رابط لكل مدخل وخطوات متحركة</footer>
</div>

 weld:{name:'مبنى قسم اللحام',floor:'',...SHOP_B,

   {id:'found',n:'ورشة تأسيسية للتبريد وتكييف الهواء',l:['ورشة تأسيسية','للتبريد وتكييف الهواء'],z:1,r:[890,160,265,275],d:[1019,437]},
   {id:'gas',n:'غرف اللحام الغازي',l:['غرف','اللحام الغازي'],z:1,r:[1195,155,125,280],d:[1257,437]},

 elec:{name:'مبنى قسم التقنية الكهربائية',floor:'',...SHOP_A,
  decor:[['label',['باب بمحرك كهربائي ٣'],272,90,'note'],['label',['مدخل السيارات'],520,90,'note'],['label',['باب بمحرك كهربائي ٢'],735,90,'note'],['label',['باب بمحرك كهربائي ١'],975,90,'note'],['label',['مدخل السيارات'],1243,90,'note']],
  rooms:[
   {id:'free',n:'منطقة عمل حر',z:1,r:[89,58,167,100],d:[170,160],s:1},
   {id:'ind',n:'ورشة لف وصيانة المحركات الحثية',l:['ورشة لف وصيانة','المحركات الحثية'],z:1,r:[250,165,205,260],d:[352,427]},
   {id:'one',n:'ورشة لف وإصلاح الآلات أحادية الوجه',l:['ورشة لف وإصلاح','الآلات أحادية الوجه'],z:1,r:[608,103,212,322],d:[714,427]},
   {id:'spec',n:'ورشة تركيبات صناعية خاصة',l:['ورشة تركيبات','صناعية خاصة'],z:1,r:[848,103,122,322],d:[909,427]},
   {id:'three',n:'ورشة تحكم المحركات ثلاثية الأوجه',l:['ورشة تحكم المحركات','ثلاثية الأوجه'],z:1,r:[980,103,182,322],d:[1071,427]},
   ...stripA(WC_TRAINER,WC_TRAINEE)]}
};
const ORDER=['g','f1','cars','mech','weld','elec'];
const secTitle=k=>MAPS[k].floor?MAPS[k].name+' · '+MAPS[k].floor:MAPS[k].name;
const SHORT={g:'الإداري · الأرضي',f1:'الإداري · الأول',cars:'ورشة السيارات',mech:'التقنية الميكانيكية',weld:'اللحام',elec:'التقنية الكهربائية'};
const STAIR_DOOR=[780,512];

// every place a visitor can ask for
const PLACES=[];
for(const k of ORDER)for(const r of MAPS[k].rooms){
  if(!r.d)continue;
  PLACES.push({m:k,id:r.id,n:r.n});
  (r.also||[]).forEach(n=>PLACES.push({m:k,id:r.id,n}));
}

const STARTS={m1:['g','E1','المبنى الإداري · المدخل الرئيسي ١'],m2:['g','E2','المبنى الإداري · المدخل الرئيسي ٢'],cars:['cars','E',MAPS.cars.name],mech:['mech','E',MAPS.mech.name],weld:['weld','E',MAPS.weld.name],elec:['elec','E',MAPS.elec.name]};
let start='m1', from='E1', target=null, section='g', view='g', legs=[], legIdx=0, stepIdx=0, drawn=null, rot=false;
let vb={...MAPS.g.full}, anim=0, plan, pathEl, pin, here, hereT;
const $=id=>document.getElementById(id);
const svg=$('map');
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}

/* ---------- draw a plan ---------- */
function label(lines,cx,cy,cls,parent){
  const t=el('text',{class:'lbl '+(cls||''),'data-cx':cx,'data-cy':cy},parent||plan), lh=cls==='s'?12:18;
  lines.forEach((s,i)=>{const ts=el('tspan',{x:cx,y:cy-(lines.length-1)*lh/2+i*lh+(cls==='s'?3:5)},t);ts.textContent=s;});
  return t;
}
function stairs(x,y,w,h,vertical){
  el('rect',{x,y,width:w,height:h,class:'room'},plan);
  if(vertical){for(let i=x+12;i<x+w;i+=12)el('line',{x1:i,y1:y+8,x2:i,y2:y+h-8,class:'stair'},plan);}
  else{for(let j=y+14;j<y+h;j+=14)el('line',{x1:x+40,y1:j,x2:x+w-40,y2:j,class:'stair'},plan);}
}
function drawMap(k){
  const M=MAPS[k]; drawn=k;
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  plan=el('g',{id:'plan'});
  const b=M.bg; el('rect',{x:b[0],y:b[1],width:b[2],height:b[3],class:'floorbg'+(M.wall?' wall':'')},plan);
  const later=[];
  for(const d of (M.base||[]).concat(M.decor||[])){
    if(d[0]==='stairs')stairs(d[1],d[2],d[3],d[4],d[5]);
    else if(d[0]==='gap')el('line',{x1:d[1],y1:d[2],x2:d[3],y2:d[4],class:'gap'},plan);
    else later.push(d);
  }
  for(const r of M.rooms){
    const [x,y,w,h]=r.r;
    const shape=r.poly?el('polygon',{points:r.poly},plan):el('rect',{x,y,width:w,height:h},plan);
    shape.setAttribute('class',(r.z?'zone':'room')+(r.d?' pick':''));
    shape.dataset.id=r.id; r.el=shape;
    if(r.d&&r.d[2]){const [dx,dy,o]=r.d; el('line',o==='h'?{x1:dx-11,y1:dy,x2:dx+11,y2:dy,class:'gap'}:{x1:dx,y1:dy-11,x2:dx,y2:dy+11,class:'gap'},plan);}
  }
  for(const r of M.rooms){const c=r.lc||[r.r[0]+r.r[2]/2,r.r[1]+r.r[3]/2];label(r.l||[r.n],c[0],c[1],r.s?'s':'');}
  for(const d of later){
    if(d[0]==='box')el('rect',{x:d[1],y:d[2],width:d[3],height:d[4],rx:6,class:'floorbg'},plan);
    else label(d[1],d[2],d[3],d[4]);
  }
  pathEl=el('polyline',{id:'path',points:''},plan);
  pin=el('circle',{id:'pin',r:9,cx:-999,cy:-999},plan);
  here=el('g',{id:'here'},plan);
  el('circle',{class:'p',r:22},here); el('circle',{class:'c',r:9},here);
  hereT=el('text',{class:'lbl',x:62,y:5,'data-cx':62,'data-cy':0},here);
}

/* ---------- routing ---------- */
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function project(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1];let t=((p[0]-a[0])*vx+(p[1]-a[1])*vy)/(vx*vx+vy*vy);t=Math.max(0,Math.min(1,t));return [a[0]+t*vx,a[1]+t*vy];}
function route(M,start,door,via){
  const nodes={...M.nodes}, tip=via||door; let best=null;
  for(const [a,b] of M.edges){const q=project(tip,nodes[a],nodes[b]),d=dist(q,tip);if(!best||d<best.d)best={a,b,q,d};}
  nodes.P=best.q;
  const edges=M.edges.filter(e=>!(e[0]===best.a&&e[1]===best.b)).concat([[best.a,'P'],['P',best.b]]);
  const D={},prev={},done=new Set(); for(const k in nodes)D[k]=Infinity; D[start]=0;
  while(true){
    let u=null; for(const k in nodes)if(!done.has(k)&&(u===null||D[k]<D[u]))u=k;
    if(u===null||u==='P')break; done.add(u);
    for(const [a,b] of edges){const v=a===u?b:b===u?a:null;if(!v)continue;const nd=D[u]+dist(nodes[u],nodes[v]);if(nd<D[v]){D[v]=nd;prev[v]=u;}}
  }
  let pts=via?[via,door]:[door],k='P'; while(k){pts.unshift(nodes[k]);k=prev[k];}
  pts=pts.filter((p,i)=>i===0||dist(p,pts[i-1])>1);
  return pts.filter((p,i)=>{if(i===0||i===pts.length-1)return true;const a=pts[i-1],c=pts[i+1];return Math.abs((p[0]-a[0])*(c[1]-p[1])-(p[1]-a[1])*(c[0]-p[0]))>1;});
}
function turn(a,b,c){const x1=b[0]-a[0],y1=b[1]-a[1],x2=c[0]-b[0],y2=c[1]-b[1];const ang=Math.atan2(x1*y2-y1*x2,x1*x2+y1*y2)*180/Math.PI;return Math.abs(ang)<30?0:ang>0?1:-1;}
const side=t=>t===0?'أمامك مباشرة':t>0?'على يمينك':'على يسارك';
function steps(leg){
  const pts=leg.pts, out=[{t:leg.first,p:0}], what=leg.stairs?'الدرج':'«'+leg.name+'»';
  for(let i=1;i<pts.length-1;i++){
    const t=turn(pts[i-1],pts[i],pts[i+1]);
    if(i===pts.length-2) out.push({t:what+' '+side(t)+'.',p:i});
    else if(t!==0) out.push({t:'انعطف '+(t>0?'يميناً':'يساراً')+' واستمر في الممر.',p:i});
  }
  if(pts.length===2) out.push({t:what+' أمامك مباشرة.',p:0});
  if(leg.stairs) out.push({t:'اصعد الدرج إلى الدور الأول.',p:pts.length-1});
  return out;
}
function buildLegs(){
  legs=[]; if(!target)return;
  const M=MAPS[target.m], room=M.rooms.find(r=>r.id===target.id), door=room.d.slice(0,2);
  const sm=STARTS[start][0];
  const enter=sm==='g'?'ادخل من '+(from==='E1'?'المدخل الرئيسي ١':'المدخل الرئيسي ٢')+' وامشِ للأمام.':'توجّه إلى المبنى الإداري وادخل من المدخل الرئيسي ١، ثم امشِ للأمام.';
  if(target.m==='g') legs.push({m:'g',pts:route(M,from,door,room.via),first:enter,name:target.n});
  else if(target.m==='f1'){
    legs.push({m:'g',pts:route(MAPS.g,from,STAIR_DOOR),first:enter,stairs:1});
    legs.push({m:'f1',pts:route(M,'S',door,room.via),first:'عند وصولك الدور الأول امشِ للأمام من الدرج.',name:target.n});
  } else legs.push({m:target.m,pts:route(M,'E',door,room.via),first:target.m===sm?'ادخل من المدخل الرئيسي وامشِ للأمام.':'توجّه إلى '+M.name+' وادخل من المدخل الرئيسي، ثم امشِ للأمام.',name:target.n});
  if(legIdx>=legs.length)legIdx=0;
}

/* ---------- view ---------- */
const centre=()=>{const f=MAPS[drawn].full;return [f.x+f.w/2,f.y+f.h/2];};
const tf=p=>{if(!rot)return p;const c=centre();return [2*c[0]-p[0],2*c[1]-p[1]];};
function applyVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);}
function flyTo(t,jump){
  cancelAnimationFrame(anim);
  if(jump||matchMedia('(prefers-reduced-motion: reduce)').matches){vb={...t};applyVB();return;}
  const s={...vb},t0=performance.now();
  (function f(now){const k=Math.min(1,(now-t0)/450),e=k*(2-k);for(const p of 'xywh')vb[p]=s[p]+(t[p]-s[p])*e;applyVB();if(k<1)anim=requestAnimationFrame(f);})(t0);
}
function fitPoints(pts,jump){
  const q=pts.map(tf),xs=q.map(p=>p[0]),ys=q.map(p=>p[1]);
  let x=Math.min(...xs)-110,y=Math.min(...ys)-90,w=Math.max(...xs)-x+110,h=Math.max(...ys)-y+90;
  if(w<460){x-=(460-w)/2;w=460;} if(h<300){y-=(300-h)/2;h=300;}
  flyTo({x,y,w,h},jump);
}
function render(fit){
  buildLegs();
  const leg=legs[legIdx], k=leg?leg.m:view, changed=drawn!==k;
  if(changed)drawMap(k);
  const M=MAPS[k];
  rot=leg?leg.pts[1][1]>leg.pts[0][1]+1:(k==='g'&&from==='E2');
  const c=centre();
  plan.setAttribute('transform',rot?`rotate(180 ${c[0]} ${c[1]})`:'');
  const sm=STARTS[start][0], st=leg?steps(leg):[], atStart=k===sm&&legIdx===0;
  const s=leg?(stepIdx>=st.length?leg.pts[leg.pts.length-1]:leg.pts[st[stepIdx].p]):atStart?M.nodes[STARTS[start][1]]:null;
  here.style.transform=s?`translate(${s[0]}px,${s[1]}px)`:'translate(-999px,-999px)';
  hereT.textContent=!atStart&&stepIdx===0?'البداية':'أنت هنا';
  plan.querySelectorAll('text').forEach(t=>t.setAttribute('transform',rot?`rotate(180 ${t.dataset.cx} ${t.dataset.cy})`:''));
  $('badge').textContent=secTitle(k);
  svg.setAttribute('aria-label','مخطط '+secTitle(k));
  $('start').value=start;
  M.rooms.forEach(r=>r.el.classList.toggle('on',!!target&&target.m===k&&r.id===target.id));
  if(leg){
    pathEl.setAttribute('points',leg.pts.map(p=>p.join(',')).join(' '));
    const e=leg.pts[leg.pts.length-1]; pin.setAttribute('cx',e[0]); pin.setAttribute('cy',e[1]);
  } else {pathEl.setAttribute('points','');pin.setAttribute('cx',-999);}
  // leg switcher
  const lg=$('legs'); lg.hidden=legs.length<2; lg.textContent='';
  legs.forEach((l,i)=>{const b=document.createElement('button');b.type='button';b.textContent=(i?'٢ · ':'١ · ')+MAPS[l.m].floor;b.setAttribute('aria-pressed',i===legIdx);b.addEventListener('click',()=>{legIdx=i;stepIdx=0;render(true);});lg.appendChild(b);});
  // written guide
  const g=$('guide'); g.textContent='';
  const add=(tag,text,cls)=>{const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;g.appendChild(e);return e;};
  if(!target){add('h3','اختر وجهتك من القائمة');add('p','أو اضغط على أي غرفة في الخريطة، وسيظهر لك المسار إليها.');}
  else{
    add('h3',target.n); add('p',secTitle(target.m),'where');
    legs.forEach((l,i)=>{if(legs.length>1)add('h4',(i?'٢ · ':'١ · ')+MAPS[l.m].floor);const ol=add('ol');steps(l).forEach((t,j)=>{const li=document.createElement('li');li.textContent=t.t;if(i===legIdx&&j===stepIdx)li.className='cur';ol.appendChild(li);});});
    const done=legIdx===legs.length-1&&stepIdx>=st.length, all=legs.map(l=>steps(l).length);
    if(done)add('h4','وصلت إلى وجهتك.');
    $('count').textContent=done?'وصلت':'الخطوة '+(all.slice(0,legIdx).reduce((a,b)=>a+b,0)+stepIdx+1).toLocaleString('ar-EG')+' من '+all.reduce((a,b)=>a+b,0).toLocaleString('ar-EG');
    $('prev').disabled=legIdx===0&&stepIdx===0; $('next').disabled=done;
  }
  $('stepper').hidden=!target;
  if(fit||changed){if(leg)fitPoints(leg.pts,changed);else flyTo(M.full,changed);}
  list();
}
function choose(p,scroll){target=p;legIdx=0;stepIdx=0;render(true);if(scroll)document.querySelector('.mapbox').scrollIntoView({behavior:'smooth',block:'nearest'});}

/* ---------- menus ---------- */
function list(){
  const q=$('q').value.trim(), box=$('list'); box.textContent='';
  const items=q?PLACES.filter(p=>p.n.includes(q)):PLACES.filter(p=>p.m===section);
  document.querySelectorAll('#secs button').forEach(b=>b.setAttribute('aria-pressed',!q&&b.dataset.k===section));
  if(!items.length){const p=document.createElement('p');p.className='none';p.textContent='لا توجد وجهة بهذا الاسم. جرّب كلمة أخرى أو اختر المبنى من الأعلى.';box.appendChild(p);return;}
  for(const p of items){
    const b=document.createElement('button');b.type='button';b.className='dest';b.textContent=p.n;
    if(q){const s=document.createElement('small');s.textContent=secTitle(p.m);b.appendChild(s);}
    b.setAttribute('aria-pressed',!!target&&target.m===p.m&&target.id===p.id&&target.n===p.n);
    b.addEventListener('click',()=>choose(p,true));
    box.appendChild(b);
  }
}
for(const k of ORDER){
  const b=document.createElement('button');b.type='button';b.textContent=SHORT[k];b.dataset.k=k;
  b.addEventListener('click',()=>{section=k;$('q').value='';if(!target){view=k;render(true);}else list();});
  $('secs').appendChild(b);
}
$('q').addEventListener('input',list);

/* ---------- pan / zoom ---------- */
const scale=()=>{const r=svg.getBoundingClientRect();return Math.max(vb.w/r.width,vb.h/r.height);};
function toMap(cx,cy){const r=svg.getBoundingClientRect(),s=scale();return [vb.x+vb.w/2+(cx-r.left-r.width/2)*s,vb.y+vb.h/2+(cy-r.top-r.height/2)*s];}
function zoomAt(f,cx,cy){
  cancelAnimationFrame(anim);
  const r=svg.getBoundingClientRect(); if(cx==null){cx=r.left+r.width/2;cy=r.top+r.height/2;}
  const nw=Math.max(240,Math.min(MAPS[drawn].full.w*1.2,vb.w*f)); f=nw/vb.w;
  const [mx,my]=toMap(cx,cy);
  vb={x:mx-(mx-vb.x)*f,y:my-(my-vb.y)*f,w:vb.w*f,h:vb.h*f}; applyVB();
}
const ptrs=new Map(); let moved=0,pinch=0;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===1)moved=0;if(ptrs.size===2){const a=[...ptrs.values()];pinch=dist(a[0],a[1]);}});
svg.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p)return;
  const dx=e.clientX-p[0],dy=e.clientY-p[1]; ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){
    moved+=Math.abs(dx)+Math.abs(dy);
    if(moved>6){try{svg.setPointerCapture(e.pointerId);}catch(_){}cancelAnimationFrame(anim);const s=scale();vb.x-=dx*s;vb.y-=dy*s;applyVB();}
  } else if(ptrs.size===2){
    moved=99;const a=[...ptrs.values()],d=dist(a[0],a[1]);
    if(pinch>0&&d>0)zoomAt(pinch/d,(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2);
    pinch=d;
  }
});
const up=e=>{ptrs.delete(e.pointerId);};
svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY>0?1.15:0.87,e.clientX,e.clientY);},{passive:false});
svg.addEventListener('click',e=>{
  const id=e.target.dataset&&e.target.dataset.id; if(moved>6||!id)return;
  const p=PLACES.find(p=>p.m===drawn&&p.id===id); if(p){section=drawn;choose(p,false);}
});
$('zin').addEventListener('click',()=>zoomAt(0.75)); $('zout').addEventListener('click',()=>zoomAt(1.33));
$('zfit').addEventListener('click',()=>flyTo(MAPS[drawn].full));

/* ---------- entrance: each barcode can open its own entrance with #m1 or #m2 ---------- */
$('next').addEventListener('click',()=>{const n=steps(legs[legIdx]).length;if(stepIdx<n-1)stepIdx++;else if(legIdx<legs.length-1){legIdx++;stepIdx=0;}else stepIdx=n;render(false);});
$('prev').addEventListener('click',()=>{if(stepIdx>0)stepIdx--;else if(legIdx>0){legIdx--;stepIdx=steps(legs[legIdx]).length-1;}render(false);});
for(const k in STARTS){const o=document.createElement('option');o.value=k;o.textContent=STARTS[k][2];$('start').appendChild(o);}
function setStart(k,write){
  if(!STARTS[k])k='m1';
  start=k; from=STARTS[k][0]==='g'?STARTS[k][1]:'E1'; section=view=STARTS[k][0]; legIdx=0; stepIdx=0;
  if(write){try{history.replaceState(null,'','#'+k);}catch(_){}}
  render(true);
}
$('start').addEventListener('change',e=>setStart(e.target.value,true));
addEventListener('hashchange',()=>setStart(location.hash.slice(1),false));
setStart(location.hash.slice(1),false);
