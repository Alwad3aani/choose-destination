<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>باركودات اختر وجهتك</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* One A4 sheet per entrance: name of the entrance on top, the code in the middle, how to use it below. */
:root{--ink:#12233d;--line:#2a5ca6;--route:#e2560a;--muted:#586a84;--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#dfe6f0;color:var(--ink);font-family:var(--font)}
.bar{padding:14px 16px;text-align:center;font-size:15px}
.bar button{font:inherit;font-weight:600;color:#fff;background:var(--line);border:0;border-radius:8px;padding:10px 22px;cursor:pointer;margin-inline-start:10px}
.sheet{width:210mm;height:296mm;max-width:100%;margin:0 auto 16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22mm 18mm;text-align:center;border-top:14mm solid var(--line);page-break-after:always;break-after:page}
.college{font-size:20pt;font-weight:600;color:var(--line);margin:0}
h1{font-size:64pt;font-weight:700;line-height:1.15;margin:4mm 0 0}
.qr{width:120mm;height:120mm;border:3mm solid var(--route);border-radius:6mm;padding:5mm;background:#fff}
.qr svg{width:100%;height:100%;display:block}
.how{font-size:22pt;line-height:1.5;margin:0}
.here{font-size:20pt;font-weight:600;margin:0;padding:3mm 8mm;border-radius:999px;background:var(--route);color:#fff}
.url{font-size:10pt;color:var(--muted);direction:ltr;margin:0}
@page{size:A4;margin:0}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;max-width:none}}
</style>
</head>
<body>
<div class="bar">ستة باركودات، ورقة لكل مدخل. <button type="button" onclick="window.print()">طباعة</button></div>
<div id="sheets"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const SITE='https://alwad3aani.github.io/choose-destination/';
const ENTRANCES=[
 ['m1','المبنى الإداري · المدخل الرئيسي ١'],
 ['m2','المبنى الإداري · المدخل الرئيسي ٢'],
 ['cars','مبنى قسم ورشة السيارات'],
 ['mech','مبنى قسم التقنية الميكانيكية'],
 ['weld','مبنى قسم اللحام'],
 ['elec','مبنى قسم التقنية الكهربائية']
];
for(const [key,name] of ENTRANCES){
  const url=SITE+'#'+key, qr=qrcode(0,'Q'); qr.addData(url); qr.make();
  const s=document.createElement('section'); s.className='sheet';
  s.innerHTML='<div><p class="college">الكلية التقنية بالعارضة</p><h1>اختر وجهتك</h1></div>'
   +'<div class="qr">'+qr.createSvgTag({cellSize:8,margin:16,scalable:true})+'</div>'
   +'<p class="how">وجّه كاميرا جوالك إلى الرمز<br>لتظهر لك خريطة ترشدك إلى وجهتك</p>'
   +'<p class="here"></p><p class="url"></p>';
  s.querySelector('.here').textContent='أنت هنا: '+name;
  s.querySelector('.url').textContent=url;
  document.getElementById('sheets').appendChild(s);
}
</script>
</body>
</html>
